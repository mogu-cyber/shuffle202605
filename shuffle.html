<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>思考の起爆装置：SHUFFLE-VORTEX</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #d4d4d4;
            font-family: 'serif';
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #vortex-container {
            text-align: center;
            border: 1px solid #444;
            padding: 40px;
            background: radial-gradient(circle, #2a2a2a 0%, #1a1a1a 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #result {
            font-size: 2rem;
            margin-bottom: 30px;
            min-height: 3rem;
            color: #e0e0e0;
            letter-spacing: 0.1rem;
        }
        .spice { color: #ff4500; } /* 毒・スパイスの色 */
        
        button {
            background-color: #333;
            color: #aaa;
            border: 1px solid #555;
            padding: 10px 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #444;
            color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .note-link {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #666;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div id="vortex-container">
        <div id="result">ボタンを押して、思考を起爆せよ</div>
        <button onclick="ignite()">IGNITE (起爆)</button>
    </div>
    <a href="#" class="note-link">#非効率の美学 #創作の種</a>

    <script>
        const words = [
            "鳥獣戯画", "雷雲", "正夢", "東京タワー", "ビール瓶の王冠", 
            "軽自動車", "図書館", "Susanoo", "古事記", "真鍮のネジ",
            "地下鉄の風", "金魚のフン", "歯車の欠け", "三日月", "タイプライター",
            "水銀", "屋上の給水塔", "古いカセットテープ", "路地裏の猫", "望遠鏡のレンズ",
            "廃墟のピアノ", "回路基板", "琥珀の中の蚊", "深夜のサービスエリア", "錆びた線路",
            "沈没船", "天気図", "万華鏡", "記憶の断片", "空き缶", "古い地図", 
            "図書室の埃", "蜃気楼", "人工衛星", "落雷の跡",
            "汚い", "透明な", "錆びた", "不機嫌な", "無意味な", 
            "重たい", "歪んだ", "眩しい", "静かな", "場違いな",
            "共鳴する", "溶ける", "加速する", "上書きする", "彷徨う",
            "猛毒の", "共食い", "手遅れの", "媚薬", "電気ショック", "劇薬"
        ];

        function ignite() {
            const resDiv = document.getElementById('result');
            
            // 2つの言葉をランダムに選ぶ
            let word1 = words[Math.floor(Math.random() * words.length)];
            let word2 = words[Math.floor(Math.random() * words.length)];
            
            // 同じ言葉にならないように
            while(word1 === word2) {
                word2 = words[Math.floor(Math.random() * words.length)];
            }

            // 画面を書き換える
            resDiv.innerHTML = `${word1} <span style="font-size: 1.2rem; color: #666;">×</span> ${word2}`;
            
            // 金属的な「カチッ」という音の代わりに、ボタンを少し光らせる演出
            resDiv.style.textShadow = "0 0 15px rgba(255,255,255,0.5)";
            setTimeout(() => {
                resDiv.style.textShadow = "none";
            }, 100);
        }
    </script>
</body>
</html>
